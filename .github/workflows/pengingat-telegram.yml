name: Pengingat Telegram

on:
  schedule:
    - cron: "0 0 * * *"   # 07:00 WIB (GitHub memakai UTC, jam bisa meleset beberapa menit)
  workflow_dispatch:       # tombol "Run workflow" untuk uji manual

permissions:
  contents: read

jobs:
  kirim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kirim pengingat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATA_FILE: data.json   # samakan dengan "path" di secrets aplikasi
        run: python .github/scripts/kirim_pengingat.py
